name: Microverse
description: Microverse is an online education platform that trains people worldwide
  to become remote software developers, founded by Ariel Camus with the stated mission
  of connecting one million people to remote jobs by 2030. Its model pairs students
  across time zones for peer collaboration that mirrors distributed engineering teams,
  and it historically charged tuition only after graduates secured a job. Microverse
  also runs Leap, an English-practice platform for developers. It is a private, distributed
  company backed by investors including Y Combinator, Hack.VC, and General Catalyst.
  Microverse does not currently publish a public developer API, SDKs, or API documentation;
  this profile captures its public web presence and security posture.
